name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Deploy Backend to hPanel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install hostinger script dependencies
        working-directory: hostinger
        run: npm ci

      - name: Create deployment archive
        working-directory: backend
        run: node ../hostinger/create-backend-archive.js

      - name: Deploy via Hostinger API
        working-directory: hostinger
        run: node deploy-backend.js
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to hPanel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install hostinger script dependencies
        working-directory: hostinger
        run: npm ci

      - name: Create deployment archive
        working-directory: frontend
        run: node ../hostinger/create-frontend-archive.js

      - name: Deploy via Hostinger API
        working-directory: hostinger
        run: node deploy-frontend.js
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

  production-smoke:
    name: Production Smoke Tests
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run API smoke checks
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://fieldserviceit.com' }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL || 'https://api.fieldserviceit.com' }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_MUTATIONS: ${{ vars.SMOKE_MUTATIONS || 'false' }}
        run: node scripts/production-smoke.mjs
