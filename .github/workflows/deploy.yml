name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Deploy Backend to hPanel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install hostinger script dependencies
        working-directory: hostinger
        run: npm ci

      - name: Create deployment archive
        working-directory: backend
        run: node ../hostinger/create-backend-archive.js

      - name: Deploy via Hostinger API
        working-directory: hostinger
        run: node deploy-backend.js
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to hPanel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add frontend remote
        run: |
          git remote add frontend-origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/nicholasnkb-cmd/fieldserviceit-frontend.git || true

      - name: Push frontend subtree
        run: |
          git subtree push --prefix=frontend frontend-origin master

      - name: Trigger hPanel redeploy
        run: |
          echo "Frontend pushed to GitHub. Trigger hPanel redeploy manually or via API."
        if: success()
