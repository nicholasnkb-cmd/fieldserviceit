name: Production Validation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: |
          npm run check:permissions
          npm run check:tenant-sql
          node ../scripts/check-module-size.mjs
          npm run build
          npm test -- --runInBand

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:a11y
          npm run build

  hostinger-preflight:
    name: Hostinger API Preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Hostinger token and live domains
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_EXPECTED_DOMAINS: ${{ vars.HOSTINGER_EXPECTED_DOMAINS || 'fieldserviceit.com,api.fieldserviceit.com' }}
        run: node scripts/hostinger-preflight.mjs

      - name: Verify security deployment prerequisites
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
        run: node scripts/security-deployment-check.mjs

  deploy-backend:
    name: Deploy Hostinger Backend
    needs: [build-backend, hostinger-preflight]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: application

      - uses: actions/checkout@v4
        with:
          repository: nicholasnkb-cmd/fieldserviceit-backend
          ref: master
          token: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          path: deployment/backend

      - name: Prepare backend deployment branch
        id: backend-sync
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "DEPLOY_REPOS_TOKEN is required"; exit 1; }
          branch="deploy/backend-${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          rsync -a application/backend/ deployment/backend/ \
            --exclude .git --exclude .github --exclude node_modules --exclude dist --exclude coverage \
            --exclude '.env*'
          cd deployment/backend
          printf '{\n  "commit": "%s",\n  "deployedAt": "%s"\n}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > release.json
          printf "export const GENERATED_RELEASE_COMMIT = '%s';\n" "$GITHUB_SHA" > src/common/generated-release.ts
          git config user.name "FieldServiceIT Deploy Bot"
          git config user.email "deploy-bot@fieldserviceit.com"
          git checkout -b "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "Backend deployment repository is already current." >> "$GITHUB_STEP_SUMMARY"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Deploy monorepo ${GITHUB_SHA::12}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Wait for backend deployment handoff
        if: steps.backend-sync.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          DEPLOY_BRANCH: ${{ steps.backend-sync.outputs.branch }}
        run: |
          for attempt in {1..120}; do
            run=$(gh run list --repo nicholasnkb-cmd/fieldserviceit-backend --workflow deployment-handoff.yml --branch "$DEPLOY_BRANCH" --limit 1 --json status,conclusion --jq '.[0] // {}' 2>/dev/null || echo '{}')
            status=$(jq -r '.status // ""' <<< "$run")
            conclusion=$(jq -r '.conclusion // ""' <<< "$run")
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Backend deployment handoff failed: $conclusion" >&2
                exit 1
              fi
              deployed=$(gh api 'repos/nicholasnkb-cmd/fieldserviceit-backend/contents/release.json?ref=master' --jq .content | base64 -d | jq -r .commit)
              if [ "$deployed" = "$GITHUB_SHA" ]; then
                exit 0
              fi
              echo "Backend handoff completed without publishing $GITHUB_SHA" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Backend deployment handoff timed out" >&2
          exit 1

  deploy-frontend:
    name: Deploy Hostinger Frontend
    needs: [build-frontend, hostinger-preflight]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: application

      - uses: actions/checkout@v4
        with:
          repository: nicholasnkb-cmd/fieldserviceit-frontend
          ref: master
          token: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          path: deployment/frontend

      - name: Prepare frontend deployment branch
        id: frontend-sync
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "DEPLOY_REPOS_TOKEN is required"; exit 1; }
          branch="deploy/frontend-${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          rsync -a application/frontend/ deployment/frontend/ \
            --exclude .git --exclude .github --exclude node_modules --exclude .next --exclude coverage \
            --exclude '.env*'
          cd deployment/frontend
          mkdir -p public
          printf '{\n  "commit": "%s",\n  "deployedAt": "%s"\n}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > public/release.json
          git config user.name "FieldServiceIT Deploy Bot"
          git config user.email "deploy-bot@fieldserviceit.com"
          git checkout -b "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "Frontend deployment repository is already current." >> "$GITHUB_STEP_SUMMARY"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Deploy monorepo ${GITHUB_SHA::12}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Wait for frontend deployment handoff
        if: steps.frontend-sync.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          DEPLOY_BRANCH: ${{ steps.frontend-sync.outputs.branch }}
        run: |
          for attempt in {1..150}; do
            run=$(gh run list --repo nicholasnkb-cmd/fieldserviceit-frontend --workflow deployment-handoff.yml --branch "$DEPLOY_BRANCH" --limit 1 --json status,conclusion --jq '.[0] // {}' 2>/dev/null || echo '{}')
            status=$(jq -r '.status // ""' <<< "$run")
            conclusion=$(jq -r '.conclusion // ""' <<< "$run")
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Frontend deployment handoff failed: $conclusion" >&2
                exit 1
              fi
              deployed=$(gh api 'repos/nicholasnkb-cmd/fieldserviceit-frontend/contents/public/release.json?ref=master' --jq .content | base64 -d | jq -r .commit)
              if [ "$deployed" = "$GITHUB_SHA" ]; then
                exit 0
              fi
              echo "Frontend handoff completed without publishing $GITHUB_SHA" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Frontend deployment handoff timed out" >&2
          exit 1

  verify-production:
    name: Verify Production
    needs: [deploy-backend, deploy-frontend]
    if: ${{ always() && !cancelled() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      HAS_VERIFICATION_CREDENTIALS: ${{ secrets.VERIFICATION_EMAIL != '' && secrets.VERIFICATION_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployed application without mutations
        env:
          VERIFICATION_WEB_URL: ${{ vars.VERIFICATION_WEB_URL || 'https://fieldserviceit.com' }}
          VERIFICATION_API_URL: ${{ vars.VERIFICATION_API_URL || 'https://api.fieldserviceit.com' }}
          VERIFICATION_EMAIL: ${{ secrets.VERIFICATION_EMAIL }}
          VERIFICATION_PASSWORD: ${{ secrets.VERIFICATION_PASSWORD }}
          REQUIRE_AUTHENTICATED_VERIFICATION: ${{ vars.REQUIRE_AUTHENTICATED_VERIFICATION || 'false' }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: node scripts/production-verification.mjs

      - uses: actions/setup-node@v4
        if: env.HAS_VERIFICATION_CREDENTIALS == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run authenticated desktop and mobile visual verification
        if: env.HAS_VERIFICATION_CREDENTIALS == 'true'
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.VERIFICATION_WEB_URL || 'https://fieldserviceit.com' }}
          E2E_EMAIL: ${{ secrets.VERIFICATION_EMAIL }}
          E2E_PASSWORD: ${{ secrets.VERIFICATION_PASSWORD }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e:prod

      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_VERIFICATION_CREDENTIALS == 'true'
        with:
          name: authenticated-production-visuals
          path: frontend/test-results
          retention-days: 14
