name: Production Validation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: |
          npm run check:permissions
          npm run check:tenant-sql
          node ../scripts/check-module-size.mjs
          npm run build
          npm test -- --runInBand

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:a11y
          npm run build

  hostinger-preflight:
    name: Hostinger API Preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Hostinger token and live domains
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_EXPECTED_DOMAINS: ${{ vars.HOSTINGER_EXPECTED_DOMAINS || 'fieldserviceit.com,api.fieldserviceit.com' }}
        run: node scripts/hostinger-preflight.mjs

      - name: Verify security deployment prerequisites
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
        run: node scripts/security-deployment-check.mjs

  deploy-backend:
    name: Deploy Hostinger Backend
    needs: [build-backend, hostinger-preflight]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: application

      - uses: actions/checkout@v4
        with:
          repository: nicholasnkb-cmd/fieldserviceit-backend
          ref: master
          token: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          path: deployment/backend

      - name: Prepare backend deployment branch
        id: backend-sync
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "DEPLOY_REPOS_TOKEN is required"; exit 1; }
          branch="deploy/backend-${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          rsync -a application/backend/ deployment/backend/ \
            --exclude .git --exclude .github --exclude node_modules --exclude dist --exclude coverage \
            --exclude '.env*'
          cd deployment/backend
          git config user.name "FieldServiceIT Deploy Bot"
          git config user.email "deploy-bot@fieldserviceit.com"
          git checkout -b "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "Backend deployment repository is already current." >> "$GITHUB_STEP_SUMMARY"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Deploy monorepo ${GITHUB_SHA::12}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Publish backend through a protected-branch pull request
        if: steps.backend-sync.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          DEPLOY_BRANCH: ${{ steps.backend-sync.outputs.branch }}
        run: |
          set -euo pipefail
          pr_url=$(gh pr create --repo nicholasnkb-cmd/fieldserviceit-backend --base master --head "$DEPLOY_BRANCH" \
            --title "Deploy backend ${GITHUB_SHA::12}" \
            --body "Automated, history-preserving deployment from monorepo commit $GITHUB_SHA.")
          pr_number="${pr_url##*/}"
          sleep 10
          check_count=$(gh pr checks "$pr_number" --repo nicholasnkb-cmd/fieldserviceit-backend --json state --jq 'length' 2>/dev/null || echo 0)
          if [ "$check_count" -gt 0 ]; then
            gh pr checks "$pr_number" --repo nicholasnkb-cmd/fieldserviceit-backend --watch --fail-fast
          fi
          gh pr merge "$pr_number" --repo nicholasnkb-cmd/fieldserviceit-backend --squash --delete-branch
          echo "Backend deployment PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Allow Hostinger backend deployment to start
        if: steps.backend-sync.outputs.branch != ''
        run: sleep 30

  deploy-frontend:
    name: Deploy Hostinger Frontend
    needs: [build-frontend, hostinger-preflight]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: application

      - uses: actions/checkout@v4
        with:
          repository: nicholasnkb-cmd/fieldserviceit-frontend
          ref: master
          token: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          path: deployment/frontend

      - name: Prepare frontend deployment branch
        id: frontend-sync
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "DEPLOY_REPOS_TOKEN is required"; exit 1; }
          branch="deploy/frontend-${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          rsync -a application/frontend/ deployment/frontend/ \
            --exclude .git --exclude .github --exclude node_modules --exclude .next --exclude coverage \
            --exclude '.env*'
          cd deployment/frontend
          git config user.name "FieldServiceIT Deploy Bot"
          git config user.email "deploy-bot@fieldserviceit.com"
          git checkout -b "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "Frontend deployment repository is already current." >> "$GITHUB_STEP_SUMMARY"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Deploy monorepo ${GITHUB_SHA::12}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Publish frontend through a protected-branch pull request
        if: steps.frontend-sync.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
          DEPLOY_BRANCH: ${{ steps.frontend-sync.outputs.branch }}
        run: |
          set -euo pipefail
          pr_url=$(gh pr create --repo nicholasnkb-cmd/fieldserviceit-frontend --base master --head "$DEPLOY_BRANCH" \
            --title "Deploy frontend ${GITHUB_SHA::12}" \
            --body "Automated, history-preserving deployment from monorepo commit $GITHUB_SHA.")
          pr_number="${pr_url##*/}"
          sleep 10
          check_count=$(gh pr checks "$pr_number" --repo nicholasnkb-cmd/fieldserviceit-frontend --json state --jq 'length' 2>/dev/null || echo 0)
          if [ "$check_count" -gt 0 ]; then
            gh pr checks "$pr_number" --repo nicholasnkb-cmd/fieldserviceit-frontend --watch --fail-fast
          fi
          gh pr merge "$pr_number" --repo nicholasnkb-cmd/fieldserviceit-frontend --squash --delete-branch
          echo "Frontend deployment PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Allow Hostinger frontend deployment to start
        if: steps.frontend-sync.outputs.branch != ''
        run: sleep 30

  verify-production:
    name: Verify Production
    needs: [deploy-backend, deploy-frontend]
    if: ${{ always() && !cancelled() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployed application without mutations
        env:
          VERIFICATION_WEB_URL: ${{ vars.VERIFICATION_WEB_URL || 'https://fieldserviceit.com' }}
          VERIFICATION_API_URL: ${{ vars.VERIFICATION_API_URL || 'https://api.fieldserviceit.com' }}
          VERIFICATION_EMAIL: ${{ secrets.VERIFICATION_EMAIL }}
          VERIFICATION_PASSWORD: ${{ secrets.VERIFICATION_PASSWORD }}
        run: node scripts/production-verification.mjs
