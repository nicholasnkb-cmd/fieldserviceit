name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-backend:
    name: Deploy Backend to hPanel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install hostinger script dependencies
        working-directory: hostinger
        run: npm ci

      - name: Create deployment archive
        working-directory: backend
        run: node ../hostinger/create-backend-archive.js

      - name: Test Hostinger API connectivity
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://developers.hostinger.com/api/hosting/v1/files/upload-urls" \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"username":"u209468809","domain":"api.fieldserviceit.com"}')
          echo "API test responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Will use hardcoded fallback token"
          else
            echo "API token from secret works"
          fi

      - name: Deploy via Hostinger API
        working-directory: hostinger
        run: node deploy-backend.js

  deploy-frontend:
    name: Deploy Frontend to hPanel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install hostinger script dependencies
        working-directory: hostinger
        run: npm ci

      - name: Create deployment archive
        working-directory: frontend
        run: node ../hostinger/create-frontend-archive.js

      - name: Deploy via Hostinger API
        working-directory: hostinger
        run: node deploy-frontend.js
