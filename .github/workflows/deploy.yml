name: Production Validation

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: |
          npm run check:permissions
          npm run check:tenant-sql
          node ../scripts/check-module-size.mjs
          npm run build
          npm test -- --runInBand

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:a11y
          npm run build

  hostinger-preflight:
    name: Hostinger API Preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Hostinger token and live domains
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_EXPECTED_DOMAINS: ${{ vars.HOSTINGER_EXPECTED_DOMAINS || 'fieldserviceit.com,api.fieldserviceit.com' }}
        run: node scripts/hostinger-preflight.mjs

      - name: Verify security deployment prerequisites
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
        run: node scripts/security-deployment-check.mjs

  deploy-hostinger:
    name: Deploy Hostinger Applications
    needs: [build-backend, build-frontend, hostinger-preflight]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      backend_commit: ${{ steps.sync.outputs.backend_commit }}
      frontend_commit: ${{ steps.sync.outputs.frontend_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Hostinger deployment repositories
        id: sync
        env:
          DEPLOY_REPOS_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
        run: |
          test -n "$DEPLOY_REPOS_TOKEN" || { echo "DEPLOY_REPOS_TOKEN is required"; exit 1; }
          backend_commit=$(git subtree split --prefix=backend HEAD)
          frontend_commit=$(git subtree split --prefix=frontend HEAD)
          backend_remote=$(git ls-remote https://github.com/nicholasnkb-cmd/fieldserviceit-backend.git refs/heads/master | cut -f1)
          frontend_remote=$(git ls-remote https://github.com/nicholasnkb-cmd/fieldserviceit-frontend.git refs/heads/master | cut -f1)
          git push "--force-with-lease=refs/heads/master:${backend_remote}" \
            "https://x-access-token:${DEPLOY_REPOS_TOKEN}@github.com/nicholasnkb-cmd/fieldserviceit-backend.git" \
            "${backend_commit}:refs/heads/master"
          git push "--force-with-lease=refs/heads/master:${frontend_remote}" \
            "https://x-access-token:${DEPLOY_REPOS_TOKEN}@github.com/nicholasnkb-cmd/fieldserviceit-frontend.git" \
            "${frontend_commit}:refs/heads/master"
          echo "backend_commit=$backend_commit" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$frontend_commit" >> "$GITHUB_OUTPUT"

      - name: Trigger backend deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.HOSTINGER_BACKEND_DEPLOY_WEBHOOK_URL }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL" || { echo "HOSTINGER_BACKEND_DEPLOY_WEBHOOK_URL is required"; exit 1; }
          curl --fail --silent --show-error --retry 3 --request POST "$DEPLOY_WEBHOOK_URL"

      - name: Trigger frontend deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.HOSTINGER_FRONTEND_DEPLOY_WEBHOOK_URL }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL" || { echo "HOSTINGER_FRONTEND_DEPLOY_WEBHOOK_URL is required"; exit 1; }
          curl --fail --silent --show-error --retry 3 --request POST "$DEPLOY_WEBHOOK_URL"

      - name: Allow Hostinger builds to start
        run: sleep 30

  production-smoke:
    name: Production Smoke Tests
    needs: [deploy-hostinger]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run API smoke checks
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://fieldserviceit.com' }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL || 'https://api.fieldserviceit.com' }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_MUTATIONS: ${{ vars.SMOKE_MUTATIONS || 'false' }}
          SMOKE_RMM_TESTS: ${{ vars.SMOKE_RMM_TESTS || 'false' }}
          SMOKE_RMM_PROVIDERS: ${{ vars.SMOKE_RMM_PROVIDERS || 'connectwise,datto,ninjaone,atera,syncro,kaseya,nable' }}
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
          SMOKE_EXPECT_FRONTEND_COMMIT: ${{ needs.deploy-hostinger.outputs.frontend_commit }}
          SMOKE_EXPECT_BACKEND_COMMIT: ${{ needs.deploy-hostinger.outputs.backend_commit }}
        run: node scripts/production-smoke.mjs
