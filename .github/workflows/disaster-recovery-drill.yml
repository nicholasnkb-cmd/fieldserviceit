name: Disaster Recovery Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 0'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-disaster-recovery-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore Latest Encrypted Backup
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run isolated restore drill
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
          VERIFICATION_API_URL: ${{ vars.VERIFICATION_API_URL || 'https://api.fieldserviceit.com' }}
        run: |
          set -euo pipefail
          test -n "$MONITORING_API_KEY" || { echo 'MONITORING_API_KEY is required'; exit 1; }
          http_status=$(curl --silent --show-error --max-time 2400 \
            -X POST -H "x-monitoring-key: $MONITORING_API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            --output restore-drill-result.json --write-out '%{http_code}' \
            "$VERIFICATION_API_URL/v1/monitoring/backups/restore-drill")
          cat restore-drill-result.json
          [[ "$http_status" =~ ^2 ]] || { echo "Restore drill returned HTTP $http_status"; exit 1; }
          drill_status=$(jq -r '.data.status // .status // empty' restore-drill-result.json)
          [[ "$drill_status" == 'PASS' ]] || { echo "Restore drill reported ${drill_status:-an invalid outcome}"; exit 1; }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: disaster-recovery-drill-result
          path: restore-drill-result.json
          retention-days: 90

  notify:
    name: Report Restore Drill Outcome
    needs: restore-drill
    if: always()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Record failed drill for administrator alerting
        if: needs.restore-drill.result != 'success'
        continue-on-error: true
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
          DEPLOYMENT_API_URL: ${{ vars.VERIFICATION_API_URL || 'https://api.fieldserviceit.com' }}
          DEPLOYMENT_RELEASE: ${{ github.sha }}
          DEPLOYMENT_COMPONENT: health
          DEPLOYMENT_STATUS: FAILED
          DEPLOYMENT_RUN_ID: dr-${{ github.run_id }}
          DEPLOYMENT_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_DETAIL: '{"check":"isolated-backup-restore-drill"}'
        run: node scripts/deployment-event.mjs
      - name: Send operations webhook on failure
        if: needs.restore-drill.result != 'success'
        continue-on-error: true
        env:
          OPERATIONS_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          ALERT_TITLE: FieldserviceIT disaster recovery drill failed
          ALERT_MESSAGE: The latest encrypted production backup could not be restored and row-count verified in an isolated MySQL session.
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/operations-webhook-alert.mjs
      - name: Open or resolve restore drill incident
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Disaster recovery restore drill failure';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', labels: 'dr-alert', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title);
            const openIncident = existing?.state === 'open' ? existing : undefined;
            const failed = '${{ needs.restore-drill.result }}' !== 'success';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (failed && !openIncident) {
              await github.rest.issues.createLabel({ owner, repo, name: 'dr-alert', color: 'B60205', description: 'Automated backup restore drill incident' }).catch((error) => { if (error.status !== 422) throw error; });
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `The restore drill failed again. [Open workflow run](${runUrl})` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open' });
              } else {
                await github.rest.issues.create({ owner, repo, title, labels: ['dr-alert'], assignees: [owner], body: `The scheduled encrypted-backup restore drill failed.\n\n[Open workflow run](${runUrl})` });
              }
            } else if (!failed && openIncident) {
              await github.rest.issues.createComment({ owner, repo, issue_number: openIncident.number, body: `The restore drill recovered. [Open workflow run](${runUrl})` });
              await github.rest.issues.update({ owner, repo, issue_number: openIncident.number, state: 'closed', state_reason: 'completed' });
            }
