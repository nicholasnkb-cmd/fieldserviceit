name: Automated Production Rollback

on:
  workflow_run:
    workflows: ["Production Validation"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      should_rollback: ${{ steps.check.outputs.should_rollback }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate)
          deploy=$(echo "$jobs" | jq -r '.jobs[] | select(.name == "Deploy Hostinger Applications") | .conclusion' | tail -1)
          verify=$(echo "$jobs" | jq -r '.jobs[] | select(.name == "Verify Production") | .conclusion' | tail -1)
          if [ "$deploy" = "success" ] && [ "$verify" = "failure" ]; then
            echo "should_rollback=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_rollback=false" >> "$GITHUB_OUTPUT"
          fi

  rollback:
    needs: inspect
    if: ${{ needs.inspect.outputs.should_rollback == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Restore previous deployment repositories
        env:
          DEPLOY_REPOS_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
        run: |
          test -n "$DEPLOY_REPOS_TOKEN" || { echo "DEPLOY_REPOS_TOKEN is required"; exit 1; }
          previous=$(git rev-parse HEAD^)
          backend_commit=$(git subtree split --prefix=backend "$previous")
          frontend_commit=$(git subtree split --prefix=frontend "$previous")
          backend_remote=$(git ls-remote https://github.com/nicholasnkb-cmd/fieldserviceit-backend.git refs/heads/master | cut -f1)
          frontend_remote=$(git ls-remote https://github.com/nicholasnkb-cmd/fieldserviceit-frontend.git refs/heads/master | cut -f1)
          git push "--force-with-lease=refs/heads/master:$backend_remote" "https://x-access-token:$DEPLOY_REPOS_TOKEN@github.com/nicholasnkb-cmd/fieldserviceit-backend.git" "$backend_commit:refs/heads/master"
          git push "--force-with-lease=refs/heads/master:$frontend_remote" "https://x-access-token:$DEPLOY_REPOS_TOKEN@github.com/nicholasnkb-cmd/fieldserviceit-frontend.git" "$frontend_commit:refs/heads/master"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify rollback recovery
        env:
          VERIFICATION_WEB_URL: ${{ vars.VERIFICATION_WEB_URL || 'https://fieldserviceit.com' }}
          VERIFICATION_API_URL: ${{ vars.VERIFICATION_API_URL || 'https://api.fieldserviceit.com' }}
        run: |
          sleep 90
          node scripts/production-verification.mjs
