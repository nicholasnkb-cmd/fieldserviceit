name: Production Uptime

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  check:
    name: Website and API
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run uptime checks
        env:
          UPTIME_WEB_URL: ${{ vars.UPTIME_WEB_URL || 'https://fieldserviceit.com' }}
          UPTIME_API_URL: ${{ vars.UPTIME_API_URL || 'https://api.fieldserviceit.com' }}
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
        run: node scripts/uptime-check.mjs

  notify:
    name: Notify Owner
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Send operations webhook on failure
        if: needs.check.result != 'success'
        continue-on-error: true
        env:
          OPERATIONS_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          ALERT_TITLE: FieldserviceIT production health alert
          ALERT_MESSAGE: Website, API, readiness, or database migration health checks failed.
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/operations-webhook-alert.mjs

      - name: Open or resolve uptime incident
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Production uptime monitor failure';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              labels: 'uptime-alert',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const openIncident = existing?.state === 'open' ? existing : undefined;
            const failed = '${{ needs.check.result }}' !== 'success';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (failed && !openIncident) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'uptime-alert',
                color: 'B60205',
                description: 'Automated production availability incident',
              }).catch((error) => {
                if (error.status !== 422) throw error;
              });
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Production checks failed again. [Open workflow run](${runUrl})`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  labels: ['uptime-alert'],
                  assignees: [owner],
                  body: `The scheduled production uptime check failed.\n\n[Open workflow run](${runUrl})`,
                });
              }
            } else if (!failed && openIncident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: openIncident.number,
                body: `Production checks recovered. [Open workflow run](${runUrl})`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: openIncident.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
