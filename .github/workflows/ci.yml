name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  DATABASE_URL: mysql://app:devpassword@localhost:3306/fieldserviceit-test
  JWT_SECRET: ci-secret-key-for-testing-only-at-least-32-characters
  JWT_EXPIRES_IN: 15m
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  FRONTEND_URL: http://localhost:3000
  STORAGE_TYPE: local
  CORS_ORIGIN: http://localhost:3000
  NODE_ENV: test

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npm run check:permissions
      - run: npm run check:tenant-sql
      - run: node ../scripts/check-module-size.mjs
      - run: node ../scripts/validate-control-register.mjs
      - run: node ../scripts/sync-product-catalog.mjs
      - run: node ../scripts/validate-public-claims.mjs

  backend-unit:
    name: Backend Unit Tests
    needs: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: fieldserviceit-test
          MYSQL_USER: app
          MYSQL_PASSWORD: devpassword
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run seed
      - run: npm test

  backend-e2e:
    name: Backend E2E Tests
    needs: backend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: fieldserviceit-test
          MYSQL_USER: app
          MYSQL_PASSWORD: devpassword
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run seed
      - run: npm run test:e2e:ci -- --runInBand

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run test:a11y

  container-build:
    name: Production Container Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag fieldserviceit-backend:${{ github.sha }} backend
      - run: docker build --tag fieldserviceit-frontend:${{ github.sha }} frontend

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend
