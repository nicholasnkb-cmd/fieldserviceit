name: Staging Validation

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend validation
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run check:permissions
          npm run check:tenant-sql
          node ../scripts/check-module-size.mjs
          npm run build
          npm test -- --runInBand
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm test -- --runInBand
          npm run test:a11y
          npm run lint
          npm run build

  staging-smoke:
    name: Staging Smoke
    needs: build-and-test
    if: ${{ vars.STAGING_BASE_URL != '' && vars.STAGING_API_URL != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run staging API smoke tests
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          SMOKE_API_URL: ${{ vars.STAGING_API_URL }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          SMOKE_MUTATIONS: 'false'
        run: node scripts/production-smoke.mjs
