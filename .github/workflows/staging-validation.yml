name: Staging Validation

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend validation
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run check:permissions
          npm run check:tenant-sql
          node ../scripts/check-module-size.mjs
          npm run build
          npm test -- --runInBand
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm test -- --runInBand
          npm run test:a11y
          npm run lint
          npm run build

  verify-staging:
    name: Verify Staging
    needs: [build-and-test]
    if: ${{ vars.STAGING_WEB_URL != '' && vars.STAGING_API_URL != '' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify staging application without mutations
        env:
          VERIFICATION_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          VERIFICATION_API_URL: ${{ vars.STAGING_API_URL }}
          VERIFICATION_EMAIL: ${{ secrets.STAGING_VERIFICATION_EMAIL }}
          VERIFICATION_PASSWORD: ${{ secrets.STAGING_VERIFICATION_PASSWORD }}
        run: node scripts/production-verification.mjs
