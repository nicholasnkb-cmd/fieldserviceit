version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the deployment environment}
      MYSQL_DATABASE: fieldserviceit
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_MAX_IDLE: ${DB_POOL_MAX_IDLE:-2}
      DB_POOL_QUEUE_LIMIT: ${DB_POOL_QUEUE_LIMIT:-100}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-10000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-30000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the deployment environment}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in the deployment environment}
      CREDENTIAL_ENCRYPTION_KEY_PREVIOUS: ${CREDENTIAL_ENCRYPTION_KEY_PREVIOUS:-}
      CLAMAV_HOST: ${CLAMAV_HOST:?Set CLAMAV_HOST to the production malware scanner}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_REQUIRED: "true"
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Set BACKUP_S3_ENDPOINT for off-site backups}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?Set BACKUP_S3_BUCKET for off-site backups}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?Set BACKUP_S3_ACCESS_KEY_ID for off-site backups}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?Set BACKUP_S3_SECRET_ACCESS_KEY for off-site backups}
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the production frontend URL}
      PORT: 4000
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST for production email}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER for production email}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS for production email}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM for production email}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the public frontend URL}
      SEED_DB: ${SEED_DB:-false}
      # S3-compatible storage (optional)
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-fieldserviceit-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      INBOUND_EMAIL_API_KEY: ${INBOUND_EMAIL_API_KEY:-}
      # Rate limiting (optional overrides)
      THROTTLE_TTL_SHORT: ${THROTTLE_TTL_SHORT:-1000}
      THROTTLE_LIMIT_SHORT: ${THROTTLE_LIMIT_SHORT:-3}
      THROTTLE_TTL_MEDIUM: ${THROTTLE_TTL_MEDIUM:-10000}
      THROTTLE_LIMIT_MEDIUM: ${THROTTLE_LIMIT_MEDIUM:-20}
      THROTTLE_TTL_LONG: ${THROTTLE_TTL_LONG:-60000}
      THROTTLE_LIMIT_LONG: ${THROTTLE_LIMIT_LONG:-100}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health/ping', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "4000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:?Set API_URL to the public API URL}
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:?Set API_URL to the public API URL}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH to the certificate chain}:/etc/ssl/certs/cert.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH to the certificate private key}:/etc/ssl/certs/key.pem:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  mysqldata:
  uploads:
